services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    volumes:
      - whisper_models:/root/.cache/huggingface
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000

  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0

volumes:
  whisper_models:
